<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Happy Birthday Aaliyah</title>

    <!-- Theme color meta tag -->
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="author" content="balloon.js - Artur Bień" />
  </head>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
    }
    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      margin: 0;
    }
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 100%;
    }
    h1 {
      color: black;
      font-size: 80px;
      line-height: 1;
      margin-bottom: 16px;
    }
    @media screen and (min-width: 768px) {
      h1 {
        font-size: 140px;
        margin-bottom: 32px;
      }
    }

    pre {
      background-color: #f4f4f4;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 12px;
      overflow-x: auto;
      text-align: left;
    }
    .code-wrapper {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 100%;
    }
    code {
      display: block;
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
    }

    #releaseBalloonsButton {
      width: 100%;
    }
    .links {
      display: block;
      margin-top: 20px;
    }
  </style>
  <body>
    <div class="container">
      <h1>Happy Birthday Aaliyah &#129293;</h1>
      <div class="links">
        <button id="releaseBalloonsButton">Float Balloons</button><br/><br/>
        
        <!--<button id="releaseTextBalloonsButton">Happy Birthday</button>-->
        Love, Dad
      </div>
    </div>
    <script src="js/balloon.js"></script>
  </body>
</html>
